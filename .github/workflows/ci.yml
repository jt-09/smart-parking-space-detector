name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Sync dependencies
        run: uv sync --locked --all-groups
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy src

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Sync dependencies
        run: uv sync --locked --all-groups
      - name: Unit and package tests with coverage
        run: >
          uv run pytest tests/unit tests/test_package.py tests/integration
          --cov=smart_parking
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=85
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Sync dependencies
        run: uv sync --locked --all-groups
      - name: Synthetic media and CLI integration
        run: uv run pytest tests/integration -q

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Sync dependencies
        run: uv sync --locked --all-groups
      - name: Build distributions
        run: uv build
      - name: Import CLI and package smoke
        run: |
          uv run python -c "import smart_parking; print(smart_parking.__version__)"
          uv run smart-parking --help
      - name: End-to-end smoke script
        run: uv run python scripts/smoke_test.py
