[project]
name = "smart-parking"
version = "1.0.0"
description = "Fixed-camera parking-lot occupancy detector with YOLO, polygon maps, CLI, API, and dashboard."
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "jt-09" }]
keywords = ["parking", "computer-vision", "yolo", "occupancy", "fastapi"]
dependencies = [
  "fastapi>=0.111,<1",
  "jinja2>=3.1,<4",
  "numpy>=1.26,<2.5",
  "opencv-python>=4.9,<5",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "pyyaml>=6.0,<7",
  "shapely>=2.0,<3",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12,<1",
  "ultralytics>=8.3,<9",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
# Heavyweight extras are added in the PRs that first use them.

[project.scripts]
smart-parking = "smart_parking.cli.main:app"

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.2,<9",
  "pytest-cov>=5.0,<7",
  "ruff>=0.5,<1",
  "mypy>=2.3.0,<3",
  "pre-commit>=3.7,<5",
  "types-PyYAML>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_parking"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["smart_parking"]

[[tool.mypy.overrides]]
module = [
  "cv2",
  "cv2.*",
  "ultralytics",
  "ultralytics.*",
  "shapely",
  "shapely.*",
  "uvicorn",
  "uvicorn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["smart_parking"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
